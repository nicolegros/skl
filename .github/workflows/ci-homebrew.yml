name: CI Homebrew

on:
  pull_request:
    branches: [main]
    paths:
      - "packaging/homebrew/**"
      - ".github/workflows/ci-homebrew.yml"

permissions:
  contents: read

jobs:
  formula:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      FORMULA: skl-ci/local/skl
      # Unauthenticated API calls share a 60/hour limit per runner IP.
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Puts brew on PATH on Linux, where the runner image ships it unlinked.
      - uses: Homebrew/actions/setup-homebrew@main

      - name: Download latest release source tarball
        run: |
          TAG="$(gh release view --json tagName --jq .tagName)"
          curl -fsSL -o skl.tar.gz "https://github.com/${{ github.repository }}/archive/refs/tags/$TAG.tar.gz"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Render formula into a local tap
        run: |
          brew tap-new --no-git "${FORMULA%/*}"
          TAP_DIR="$(brew --repository "${FORMULA%/*}")"
          mkdir -p "$TAP_DIR/Formula"
          packaging/homebrew/render-formula.sh "$VERSION" skl.tar.gz > "$TAP_DIR/Formula/skl.rb"
          cat "$TAP_DIR/Formula/skl.rb"

      - run: brew style "$FORMULA"

      - run: brew audit --strict --online --formula "$FORMULA"

      - name: Build, test and uninstall end to end
        run: packaging/homebrew/e2e.sh "$FORMULA"
